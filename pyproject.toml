[project]
name = "dear-diary"
version = "0.2.0"
description = "Diario de voz privado en Telegram con Whisper, Ollama y SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "ctranslate2>=4.5",
    "faster-whisper>=1.2.1",
    "httpx>=0.28,<1",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "tzdata>=2025.2",
]

[dependency-groups]
web = ["streamlit>=1.66,<2"]
dev = ["pytest>=8.3,<10"]
notebooks = ["ipykernel>=7.3.0", "pandas>=3.0.5", "transformers>=4.57.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
